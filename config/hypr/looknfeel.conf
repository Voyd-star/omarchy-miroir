# Miroir look'n'feel — motion & decoration (ported from looknfeel.lua for Omarchy 3.8.4 / hyprlang).
# Composite-only (transform/opacity), 60fps. Overrides the Omarchy defaults sourced earlier.
#
# NOTE: the live per-theme accent border/shadow (miroir-theme-apply -> miroir-theme.lua) only
# works on Omarchy 4.0 (lua config). On 3.8.4 the accent below is a static violet default.

# Miroir accent (violet -> cyan). Change per taste; not driven live by the theme on 3.8.4.
$activeBorderColor = rgba(a97bf0ee) rgba(4fd6e0ee) 45deg
$inactiveBorderColor = rgba(1b1730aa)

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = false
    layout = dwindle
}

decoration {
    rounding = 11
    dim_inactive = true
    dim_strength = 0.08
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        popups = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(a97bf066)
        color_inactive = rgba(00000000)
    }
}

# Snappier, more alive motion. easeOutExpo-ish curve + subtle scale, workspaces slide.
animations {
    enabled = yes, please :)

    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = miroirOut, 0.16, 1, 0.3, 1
    bezier = miroirBack, 0.34, 1.28, 0.64, 1

    animation = windows, 1, 4.4, miroirOut, popin 80%
    animation = windowsIn, 1, 4.8, miroirBack, popin 78%
    animation = windowsOut, 1, 3.6, miroirOut, popin 82%
    animation = windowsMove, 1, 5, miroirOut
    animation = border, 1, 4, miroirOut
    animation = fade, 1, 4.2, almostLinear
    animation = workspaces, 1, 5.2, miroirOut, slide
    animation = specialWorkspace, 1, 4.4, miroirOut, slidevert
    animation = layers, 1, 4.4, miroirOut, popin 90%
    animation = layersIn, 1, 4.6, miroirOut, fade
    animation = layersOut, 1, 3, almostLinear, fade
}

# Live per-theme accent: border gradient + shadow color, regenerated by
# ~/.local/bin/miroir-theme-apply on every theme change (overrides the static
# accent above). Generated for the current theme at install time so it always exists.
source = ~/.config/hypr/miroir-theme.conf
